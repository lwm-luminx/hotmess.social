name: Poster slogans

# Checks that src/lib/poster/slogans.json matches the library the AudienceKit console's poster builder reads
# (GET /v1/poster/slogans on the API this site uses), so the two poster builders print the same lines. On a
# mismatch: npm run sync-slogans, node scripts/marquee-slides.mjs, commit. Advisory (continue-on-error) like the
# GraphQL documents check, because the API's next deploy can land before or after a PR here; a daily run catches a
# line added in the API.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 15 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: slogans.json matches the API
        continue-on-error: true
        run: node scripts/sync-slogans.mjs --check
