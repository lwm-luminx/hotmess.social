name: Workers build

# Builds the Cloudflare Worker. Deployment is managed by Cloudflare Workers Builds.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Picks up apps changed in AudienceKit's console (the link files below).
  schedule:
    - cron: '17 9 * * *'

permissions:
  contents: read
  packages: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npm test
      # The link files list the Hot Mess audience's apps as AudienceKit has them; the committed copies ship when the
      # API can't answer or answers with something that isn't JSON.
      - name: Fetch the link files from AudienceKit
        run: |
          for file in apple-app-site-association assetlinks.json; do
            if curl -fsS --max-time 20 "https://api.next.audiencekit.com/.well-known/$file?host=hotmess.admin.next.audiencekit.com" -o "$RUNNER_TEMP/$file" \
              && jq -e . "$RUNNER_TEMP/$file" > /dev/null; then
              cp "$RUNNER_TEMP/$file" "public/.well-known/$file"
            else
              echo "Keeping the committed $file"
            fi
          done
      - run: npm run build
        env:
          # Error reports name the commit they came from.
          PUBLIC_RELEASE: ${{ github.sha }}
      - uses: actions/upload-artifact@v4
        with:
          name: cloudflare-worker
          path: dist
