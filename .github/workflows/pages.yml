name: Pages

# Builds the site on every push and pull request, and publishes main to
# GitHub Pages (Settings → Pages → Source: GitHub Actions; custom domain
# hotmess.social).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Picks up apps changed in AudienceKit's console (the link files below).
  schedule:
    - cron: '17 9 * * *'

permissions:
  contents: read
  packages: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npm test
      # The link files list the Hot Mess audience's apps as AudienceKit has them; the committed copies ship when the
      # API can't answer or answers with something that isn't JSON.
      - name: Fetch the link files from AudienceKit
        run: |
          for file in apple-app-site-association assetlinks.json; do
            if curl -fsS --max-time 20 "https://api.audiencekit.com/.well-known/$file?host=hotmess.social" -o "$RUNNER_TEMP/$file" \
              && jq -e . "$RUNNER_TEMP/$file" > /dev/null; then
              cp "$RUNNER_TEMP/$file" "public/.well-known/$file"
            else
              echo "Keeping the committed $file"
            fi
          done
      - run: npm run build
        env:
          # Error reports name the commit they came from.
          PUBLIC_RELEASE: ${{ github.sha }}
      - if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
